<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>§6 — интерактивная практика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=PT+Sans:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #f6f1e7; --surface: #fffcf5; --ink: #2b2420; --muted: #7a6f60;
    --accent: #0f5c56; --accent-soft: #d9ece9; --gold: #b8863b; --gold-soft: #f3e6cd;
    --bad: #a23b2e; --bad-soft: #f6e2dd; --good: #2e7d4f; --good-soft: #e1efe3;
    --border: #e2d7c3; --head-bg: #2b2420; --head-ink: #f6f1e7;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#1b1815; --surface:#262220; --ink:#efe8dc; --muted:#a89d8c;
      --accent:#5fc9bd; --accent-soft:#233b38; --gold:#d9ab5f; --gold-soft:#332a1a;
      --bad:#e08c7d; --bad-soft:#3a2420; --good:#7fcf9d; --good-soft:#1f3327;
      --border:#3a332c; --head-bg:#efe8dc; --head-ink:#1b1815; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#1b1815; --surface:#262220; --ink:#efe8dc; --muted:#a89d8c;
    --accent:#5fc9bd; --accent-soft:#233b38; --gold:#d9ab5f; --gold-soft:#332a1a;
    --bad:#e08c7d; --bad-soft:#3a2420; --good:#7fcf9d; --good-soft:#1f3327;
    --border:#3a332c; --head-bg:#efe8dc; --head-ink:#1b1815; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'PT Sans', sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 18px 60px; line-height: 1.55;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-family: 'Lora', serif; font-size: 1.4rem; margin: 0 0 4px; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 0.88rem; margin: 0 0 6px; }
  .backlink { font-size: 0.82rem; margin-bottom: 18px; }
  .backlink a { color: var(--accent); }

  .tok { font-family: 'Noto Naskh Arabic', serif; direction: rtl; unicode-bidi: isolate; }
  .translit { font-style: italic; color: var(--muted); font-size: 0.85rem; }

  /* ---- deck picker ---- */
  .decks { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .deck-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
    gap: 10px; cursor: pointer; transition: border-color .15s;
  }
  .deck-card:hover { border-color: var(--accent); }
  .deck-card .dmeta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .deck-card .dtitle { font-family: 'Lora', serif; font-weight: 600; font-size: 1.02rem; }
  .deck-card .dscore { font-size: 0.8rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .deck-card .dprog { height: 5px; border-radius: 4px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .deck-card .dprog > div { height: 100%; background: var(--accent); width: 0%; }

  .overall { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px; }
  .overall b { color: var(--accent); font-family: 'Lora', serif; }
  .overall .bar { height: 8px; border-radius: 5px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .overall .bar > div { height: 100%; background: var(--accent); }

  /* ---- quiz view ---- */
  #quizView { display: none; }
  .qz-top { display:flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
  .qz-top .back { font-size: 0.85rem; color: var(--accent); cursor: pointer; border: none; background: none; padding: 4px 0; }
  .qz-top .progress-txt { font-size: 0.8rem; color: var(--muted); }
  .qz-bar { height: 6px; border-radius: 4px; background: var(--border); margin-bottom: 20px; overflow: hidden; }
  .qz-bar > div { height: 100%; background: var(--accent); transition: width .2s; }

  .q-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 16px; margin-bottom: 16px;
  }
  .q-prompt { font-size: 0.98rem; margin: 0 0 14px; }
  .q-prompt .tok { font-size: 1.3rem; display: block; margin-bottom: 4px; text-align: center; }
  .q-prompt .translit { display: block; text-align: center; margin-bottom: 6px; }

  .opt-list { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 0.92rem;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; color: var(--ink); cursor: pointer; transition: border-color .12s, background .12s;
  }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); }
  .opt-btn.opt-correct { background: var(--good-soft); border-color: var(--good); font-weight: 700; }
  .opt-btn.opt-wrong { background: var(--bad-soft); border-color: var(--bad); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn .tok { font-size: 1.1rem; }

  /* order-builder */
  .order-target {
    min-height: 54px; border: 2px dashed var(--border); border-radius: 10px;
    padding: 10px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px;
    direction: rtl; align-items: center;
  }
  .order-target.empty::before { content: "нажимай слова снизу в нужном порядке →"; direction: ltr; color: var(--muted); font-size: 0.82rem; }
  .order-target .wtile {
    font-family: 'Noto Naskh Arabic', serif; font-size: 1.15rem; background: var(--accent-soft);
    border: 1px solid var(--accent); border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }
  .order-pool { display: flex; flex-wrap: wrap; gap: 6px; direction: rtl; margin-bottom: 14px; }
  .order-pool .wtile {
    font-family: 'Noto Naskh Arabic', serif; font-size: 1.15rem; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }
  .order-pool .wtile:hover { border-color: var(--accent); }
  .order-target .wtile.tile-correct { background: var(--good-soft); border-color: var(--good); }
  .order-target .wtile.tile-wrong { background: var(--bad-soft); border-color: var(--bad); }
  .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    font: inherit; font-size: 0.9rem; font-weight: 700; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; padding: 9px 16px; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: 0.45; cursor: default; }

  .feedback { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 0.88rem; display: none; }
  .feedback.show { display: block; }
  .feedback.good { background: var(--good-soft); color: var(--good); }
  .feedback.bad { background: var(--bad-soft); color: var(--bad); }
  .feedback .ans { color: var(--ink); font-weight: 700; margin-top: 4px; display: block; }

  .qz-nav { display: flex; justify-content: space-between; margin-top: 4px; }

  .done-screen { text-align: center; padding: 30px 16px; }
  .done-screen .big { font-family: 'Lora', serif; font-size: 1.6rem; color: var(--accent); margin-bottom: 8px; }

  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>
<div class="wrap">

<div id="homeView">
  <h1>§6 — интерактивная практика</h1>
  <p class="sub">Проверяешь себя сама: выбираешь перевод, составляешь предложение, подбираешь местоимение и предлог — по всему материалу уроков 6.1–6.9.</p>
  <div class="backlink"><a href="arabic-6-exercises.html">← к разбору с объяснениями</a></div>

  <div class="overall" id="overallBox">
    <b>Всего по уроку §6:</b>
    <span id="overallTxt"></span>
    <div class="bar"><div id="overallBar"></div></div>
  </div>

  <div class="decks" id="deckList"></div>
</div>

<div id="quizView">
  <div class="qz-top">
    <button class="back" id="backBtn">← к списку</button>
    <span class="progress-txt" id="progressTxt"></span>
  </div>
  <div class="qz-bar"><div id="qzBarFill"></div></div>
  <div id="qCardHolder"></div>
</div>

<footer>Arabic Classes — §6, интерактивная практика</footer>
</div>

<script>
const DATA = {"decks": [{"id": "deck1", "title": "Слова и управление предлогами", "items": [{"type": "mcq", "ar": "لَدَى", "translit": "ladā", "prompt": "Что значит «لَدَى» (ladā)?", "options": ["у, при (предлог принадлежности — «у меня есть» = ladayya)", "присутствовать; приходить (куда-л. — إِلَى)", "письменный стол; кабинет; офис"], "answer": "у, при (предлог принадлежности — «у меня есть» = ladayya)"}, {"type": "mcq", "ar": "بَعْدَ", "translit": "baʿda", "prompt": "Что значит «بَعْدَ» (baʿda)?", "options": ["банк", "после (предлог)", "заходить (к кому-л. — عَلَى)"], "answer": "после (предлог)"}, {"type": "mcq", "ar": "حَضَرَ", "translit": "ḥaḍara", "prompt": "Что значит «حَضَرَ» (ḥaḍara)?", "options": ["присутствовать; приходить (куда-л. — إِلَى)", "чашка", "письменный стол; кабинет; офис"], "answer": "присутствовать; приходить (куда-л. — إِلَى)"}, {"type": "mcq", "ar": "بَحَثَ", "translit": "baḥatha", "prompt": "Что значит «بَحَثَ» (baḥatha)?", "options": ["банк", "искать (кого-л., что-л. — عَنْ)", "у, при (предлог принадлежности — «у меня есть» = ladayya)"], "answer": "искать (кого-л., что-л. — عَنْ)"}, {"type": "mcq", "ar": "دَخَلَ", "translit": "dakhala", "prompt": "Что значит «دَخَلَ» (dakhala)?", "options": ["чашка", "искать (кого-л., что-л. — عَنْ)", "заходить (к кому-л. — عَلَى)"], "answer": "заходить (к кому-л. — عَلَى)"}, {"type": "mcq", "ar": "طَلَبَ", "translit": "ṭalaba", "prompt": "Что значит «طَلَبَ» (ṭalaba)?", "options": ["чашка", "искать (кого-л., что-л. — عَنْ)", "просить (у кого-л. — مِنْ)"], "answer": "просить (у кого-л. — مِنْ)"}, {"type": "mcq", "ar": "هُنَا", "translit": "hunā", "prompt": "Что значит «هُنَا» (hunā)?", "options": ["искать (кого-л., что-л. — عَنْ)", "там; имеется", "здесь"], "answer": "здесь"}, {"type": "mcq", "ar": "خَرِيطَةٌ", "translit": "kharīṭatun", "prompt": "Что значит «خَرِيطَةٌ» (kharīṭatun)?", "options": ["у, при (предлог принадлежности — «у меня есть» = ladayya)", "присутствовать; приходить (куда-л. — إِلَى)", "к const STORE_KEY = "arabic6_practice_progress_v1";
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch(e) {}
}
let progress = loadProgress();

let state = {
  deckId: null,
  order: [],
  idx: 0,
  correctCount: 0,
  answered: false,
  deckResults: {}, // idx -> bool
};

function shuffledIndices(n) {
  const arr = Array.from({length:n}, (_,i)=>i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderHome() {
  document.getElementById("quizView").style.display = "none";
  document.getElementById("homeView").style.display = "block";
  const list = document.getElementById("deckList");
  list.innerHTML = "";
  let totalItems = 0, totalDone = 0, totalCorrect = 0;
  DATA.decks.forEach(deck => {
    const p = progress[deck.id] || {};
    const doneCount = Object.keys(p).length;
    const correctCount = Object.values(p).filter(v=>v).length;
    totalItems += deck.items.length;
    totalDone += doneCount;
    totalCorrect += correctCount;
    const pct = deck.items.length ? Math.round(100*doneCount/deck.items.length) : 0;
    const card = document.createElement("div");
    card.className = "deck-card";
    card.innerHTML = `
      <div style="flex:1">
        <div class="dtitle">${deck.title}</div>
        <div class="dmeta">${deck.items.length} заданий${doneCount ? " · пройдено " + doneCount : ""}</div>
        <div class="dprog"><div style="width:${pct}%"></div></div>
      </div>
      <div class="dscore">${doneCount ? Math.round(100*correctCount/doneCount)+"%" : "начать"}</div>
    `;
    card.addEventListener("click", () => startDeck(deck.id));
    list.appendChild(card);
  });
  const overallPct = totalItems ? Math.round(100*totalDone/totalItems) : 0;
  document.getElementById("overallTxt").textContent =
    ` пройдено ${totalDone} из ${totalItems} заданий` + (totalDone ? `, верно ${Math.round(100*totalCorrect/totalDone)}%` : "");
  document.getElementById("overallBar").style.width = overallPct + "%";
}

function startDeck(deckId) {
  const deck = DATA.decks.find(d => d.id === deckId);
  state.deckId = deckId;
  state.order = shuffledIndices(deck.items.length);
  state.idx = 0;
  state.correctCount = 0;
  state.answered = false;
  state.deckResults = {};
  document.getElementById("homeView").style.display = "none";
  document.getElementById("quizView").style.display = "block";
  renderQuestion();
}

function currentDeck() { return DATA.decks.find(d => d.id === state.deckId); }

function renderQuestion() {
  const deck = currentDeck();
  if (state.idx >= state.order.length) {
    renderDone(deck);
    return;
  }
  const itemIndex = state.order[state.idx];
  const item = deck.items[itemIndex];
  state.answered = false;
  document.getElementById("progressTxt").textContent = `${deck.title} · ${state.idx+1}/${state.order.length}`;
  document.getElementById("qzBarFill").style.width = Math.round(100*state.idx/state.order.length) + "%";

  const holder = document.getElementById("qCardHolder");
  holder.innerHTML = "";
  const card = document.createElement("div");
  card.className = "q-card";

  if (item.type === "mcq") {
    let promptHtml = `<div class="q-prompt">`;
    if (item.ar) {
      promptHtml += `<span class="tok">${item.ar}</span>`;
      if (item.translit) promptHtml += `<span class="translit">${item.translit}</span>`;
    }
    promptHtml += `${item.prompt}</div>`;
    card.innerHTML = promptHtml + `<div class="opt-list" id="optList"></div><div class="feedback" id="fb"></div>`;
    holder.appendChild(card);
    const optList = document.getElementById("optList");
    item.options.forEach(opt => {
      const b = document.createElement("button");
      b.className = "opt-btn";
      b.innerHTML = /[؀-ۿ]/.test(opt) ? `<span class="tok">${opt}</span>` : opt;
      b.addEventListener("click", () => chooseMcq(item, opt, b, optList));
      optList.appendChild(b);
    });
  } else if (item.type === "order") {
    card.innerHTML = `
      <div class="q-prompt">${item.ru}</div>
      <div class="order-target empty" id="orderTarget"></div>
      <div class="order-pool" id="orderPool"></div>
      <div class="order-actions">
        <button class="btn" id="checkOrderBtn">Проверить</button>
        <button class="btn ghost" id="resetOrderBtn">Сбросить</button>
      </div>
      <div class="feedback" id="fb"></div>
    `;
    holder.appendChild(card);
    setupOrderQuestion(item);
  }
}

function markResult(itemIndex, correct) {
  state.deckResults[itemIndex] = correct;
  if (!progress[state.deckId]) progress[state.deckId] = {};
  progress[state.deckId][itemIndex] = correct;
  saveProgress(progress);
}

function chooseMcq(item, chosen, btn, optList) {
  if (state.answered) return;
  state.answered = true;
  const correct = chosen === item.answer;
  if (correct) state.correctCount++;
  const itemIndex = state.order[state.idx];
  markResult(itemIndex, correct);

  [...optList.children].forEach(b => {
    b.disabled = true;
    const txt = b.textContent.trim();
    if (txt === item.answer) b.classList.add("opt-correct");
  });
  if (!correct) btn.classList.add("opt-wrong");

  const fb = document.getElementById("fb");
  fb.className = "feedback show " + (correct ? "good" : "bad");
  fb.innerHTML = correct ? "Верно!" : `Неверно. <span class="ans">Правильный ответ: ${item.answer}</span>`;

  showNextButton();
}

function setupOrderQuestion(item) {
  const target = document.getElementById("orderTarget");
  const pool = document.getElementById("orderPool");
  const tokens = item.tokens.map((t, i) => ({t, i, placed: false}));
  const shuffled = shuffledIndices(tokens.length);
  let placedSeq = []; // tracks the ORDER the user clicked tokens into the target, independent of original index

  function renderPool() {
    pool.innerHTML = "";
    shuffled.forEach(i => {
      if (tokens[i].placed) return;
      const tile = document.createElement("span");
      tile.className = "wtile";
      tile.textContent = tokens[i].t;
      tile.addEventListener("click", () => {
        tokens[i].placed = true;
        placedSeq.push(tokens[i]);
        renderTarget();
        renderPool();
      });
      pool.appendChild(tile);
    });
  }
  function renderTarget() {
    target.classList.toggle("empty", placedSeq.length === 0);
    target.innerHTML = "";
    placedSeq.forEach(tok => {
      const tile = document.createElement("span");
      tile.className = "wtile";
      tile.textContent = tok.t;
      tile.addEventListener("click", () => {
        tok.placed = false;
        placedSeq = placedSeq.filter(x => x !== tok);
        renderTarget();
        renderPool();
      });
      target.appendChild(tile);
    });
  }
  renderPool();
  renderTarget();

  document.getElementById("resetOrderBtn").addEventListener("click", () => {
    tokens.forEach(t => t.placed = false);
    placedSeq = [];
    renderPool();
    renderTarget();
  });
  document.getElementById("checkOrderBtn").addEventListener("click", () => {
    if (state.answered) return;
    if (placedSeq.length !== tokens.length) {
      const fb = document.getElementById("fb");
      fb.className = "feedback show bad";
      fb.textContent = "Сначала используй все слова.";
      return;
    }
    state.answered = true;
    let allCorrect = true;
    [...target.children].forEach((tile, pos) => {
      const tok = placedSeq[pos];
      if (tok.i === pos) {
        tile.classList.add("tile-correct");
      } else {
        tile.classList.add("tile-wrong");
        allCorrect = false;
      }
    });
    if (allCorrect) state.correctCount++;
    const itemIndex = state.order[state.idx];
    markResult(itemIndex, allCorrect);

    const fb = document.getElementById("fb");
    fb.className = "feedback show " + (allCorrect ? "good" : "bad");
    fb.innerHTML = allCorrect ? "Верно! Порядок слов правильный." :
      `Порядок неверный. <span class="ans">Правильно: ${item.tokens.join(" ")}</span>`;

    document.getElementById("checkOrderBtn").disabled = true;
    showNextButton();
  });
}

function showNextButton() {
  const holder = document.getElementById("qCardHolder");
  const nav = document.createElement("div");
  nav.className = "qz-nav";
  const isLast = state.idx + 1 >= state.order.length;
  nav.innerHTML = `<span></span><button class="btn" id="nextBtn">${isLast ? "Итоги" : "Дальше →"}</button>`;
  holder.appendChild(nav);
  document.getElementById("nextBtn").addEventListener("click", () => {
    state.idx++;
    renderQuestion();
  });
}

function renderDone(deck) {
  document.getElementById("progressTxt").textContent = `${deck.title} · готово`;
  document.getElementById("qzBarFill").style.width = "100%";
  const holder = document.getElementById("qCardHolder");
  const pct = state.order.length ? Math.round(100*state.correctCount/state.order.length) : 0;
  holder.innerHTML = `
    <div class="done-screen">
      <div class="big">${pct}%</div>
      <p>Правильно ${state.correctCount} из ${state.order.length}.</p>
      <button class="btn" id="retryBtn">Пройти ещё раз</button>
      <button class="btn ghost" id="homeBtn">К списку заданий</button>
    </div>
  `;
  document.getElementById("retryBtn").addEventListener("click", () => startDeck(deck.id));
  document.getElementById("homeBtn").addEventListener("click", renderHome);
}

document.getElementById("backBtn").addEventListener("click", renderHome);

renderHome();
</script>
