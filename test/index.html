<style>

html{-webkit-text-size-adjust:100%}

a{color:inherit}
.top{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 0;display:flex;justify-content:space-between;align-items:center;color:var(--paper2)}
.top a{text-decoration:none;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.top a:hover{color:var(--orange)}
.brand{font-style:italic;letter-spacing:.12em;font-size:18px}
.card{max-width:760px;margin:16px auto 40px;background:var(--paper);padding:34px 22px 36px;border-top:3px solid var(--orange);box-shadow:0 18px 50px rgba(0,0,0,.35)}
@media(min-width:700px){.card{padding:48px 56px 52px;margin:24px auto 60px}}
.kicker{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
h1,h2{font-weight:400;color:var(--orange);font-style:italic;line-height:1.15;margin:0 0 16px;text-wrap:balance}
h1{font-size:clamp(30px,6vw,44px)}h2{font-size:clamp(24px,4.6vw,32px)}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.note{background:var(--paper2);border-left:3px solid var(--orange);padding:14px 18px;margin:18px 0;font-style:italic}
.steps{display:flex;gap:6px;margin:0 0 26px;padding:0;list-style:none;flex-wrap:wrap}
.steps li{font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.steps li.on{background:var(--orange);border-color:var(--orange);color:#fff}
.steps li.done{background:var(--beige);border-color:var(--beige);color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0 6px}
@media(min-width:600px){.facts{grid-template-columns:repeat(4,1fr)}}
.facts div{background:var(--paper2);padding:14px;text-align:center;font-size:14px}
.facts b{display:block;font-weight:400;font-style:italic;color:var(--orange);font-size:22px;line-height:1.2}
label.f{display:block;font-weight:700;margin:22px 0 8px}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=tel],textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:transparent}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--orange)}
.opt input{margin:4px 0 0;accent-color:var(--orange);flex:none;width:18px;height:18px}
.opt:has(input:checked){border-color:var(--orange);background:#fff6ef}
.btn{display:inline-block;font:inherit;font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:15px 30px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--orange);border-color:var(--orange)}
.btn.o{background:transparent;color:var(--ink)}
.btn.o:hover{color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed;background:var(--ink);border-color:var(--ink)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.err{color:#b00020;font-size:15px;margin-top:10px;min-height:1em}
.bar{height:6px;background:rgba(28,25,22,.1);border-radius:6px;overflow:hidden;margin:6px 0 24px}
.bar i{display:block;height:100%;background:var(--orange);width:0;transition:width .4s}
.qhead{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.q{font-size:clamp(20px,4vw,24px);margin:6px 0 18px;line-height:1.4}
.q .gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--orange)}
.text{background:var(--paper2);padding:18px 20px;margin:0 0 22px;line-height:1.75}
.rq{margin:22px 0 0}
.rq p{font-weight:700;margin-bottom:10px}
.player{display:flex;align-items:center;gap:16px;background:var(--paper2);padding:16px 18px;margin:0 0 22px;flex-wrap:wrap}
.play{width:58px;height:58px;border-radius:50%;border:0;background:var(--orange);color:#fff;font-size:22px;cursor:pointer;flex:none}
.play:disabled{opacity:.4;cursor:not-allowed}
.player small{color:var(--muted);display:block}
.lvl{font-size:clamp(64px,16vw,110px);font-style:italic;color:var(--orange);line-height:1;margin:6px 0 4px}
.res-grid{display:grid;gap:12px;margin:22px 0}

.res-grid span{font-size:14px;color:var(--muted)}

ul.list li{margin:4px 0}
.mgr{margin-top:26px;padding:20px 18px;background:var(--paper2);border-top:3px solid var(--orange)}
.mgr p{margin:0 0 12px;font-style:italic}
.btn.mg{display:inline-block;background:var(--orange);border-color:var(--orange);color:#fff;line-height:1.2;font-size:11px;padding:9px 18px;flex:none}
.phf{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.phf input{flex:1;min-width:180px;width:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mgr .mt{font-style:italic;margin:0 0 12px}
.mgr .ok{color:#2e7d32;margin:0}

.btn.mg small{display:block;font-weight:400;letter-spacing:.04em;text-transform:none;font-style:italic;font-size:11.5px;margin-top:2px}
.btn.mg:hover{background:var(--ink);border-color:var(--ink)}
.send{margin-top:22px;padding:16px 18px;border:1px dashed var(--line);font-size:15px}
.send.ok{border-color:#2e7d32;color:#2e7d32;border-style:solid}
.send.bad{border-color:#b00020}
.hide{display:none!important}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

body{padding-bottom:20px}

 if(PREVIEW){if(!S.form.name)S.form.name="Анна";if(!S.form.age)S.form.age="30"}
 if(!S.form.name){document.getElementById("err").textContent="Пожалуйста, напишите ваше имя.";document.getElementById("nm").focus();return}
 if(!S.form.age){document.getElementById("err").textContent="Пожалуйста, укажите возраст.";document.getElementById("ag").focus();return}
 startGrammar()};
function save(){var g=function(id){return document.getElementById(id).value.trim()};
 var c=function(n){return [].map.call(document.querySelectorAll('input[name='+n+']:checked'),function(x){return x.value})};
 var fm=document.querySelector('input[name=fmt]:checked');S.form={name:g("nm"),age:g("ag"),fmt:fm?fm.value:"",exp:c("exp"),when:g("when"),weak:c("weak"),weako:g("weako"),str:g("str"),goal:g("goal"),expect:g("expect")}}}

/* ---------- 2. адаптивная грамматика: 5 блоков по 6 вопросов ---------- */
var STAGES=5,PER=6;
function startGrammar(){S.stage=0;S.L=2;S.seen={A1:{},A2:{},B1:{},B2:{},C1:{}};S.answers=[];S.stages=[];nextStage()}
function pickStage(lv){ /* 6 случайных вопросов уровня: сначала новые темы, без повторов */
 var pool=shuffle(BANK[lv].map(function(q,i){return i}).filter(function(i){return !S.seen[lv][i]})),out=[],topics={};
 pool.forEach(function(i){if(out.length<PER&&!topics[BANK[lv][i][2]]){topics[BANK[lv][i][2]]=1;out.push(i)}});
 pool.forEach(function(i){if(out.length<PER&&out.indexOf(i)<0)out.push(i)});
 return out}
function nextStage(){
 var lv=LV[S.L],idx=pickStage(lv);
 if(idx.length<PER){var alt=[S.L+1,S.L-1].filter(function(k){return k>=0&&k<5&&pickStage(LV[k]).length>=PER})[0];
   if(alt===undefined)return startReading();S.L=alt;lv=LV[S.L];idx=pickStage(lv)}
 idx.forEach(function(i){S.seen[lv][i]=1});
 S.stageQs=idx.map(function(i){var q=BANK[lv][i];return {q:q[0],ok:q[1][0],opts:shuffle(q[1]),topic:q[2],lv:lv}});
 S.qi=0;question()}
function question(){
 var total=STAGES*PER,done=S.stage*PER+S.qi,it=S.stageQs[S.qi];
 render(steps(1)+'<span class="kicker">Часть 2 из 4 · грамматика и лексика</span>'+
 '<div class="qhead"><span>Вопрос '+(done+1)+' из '+total+'</span><span>Выберите верный вариант</span></div><div class="bar"><i style="width:'+(done/total*100)+'%"></i></div>'+
 '<p class="q">'+esc(it.q).replace("___",'<span class="gap"></span>')+'</p>'+
 '<div class="opts">'+it.opts.map(function(o,i){return '<label class="opt"><input type="radio" name="a" value="'+i+'"><span>'+esc(o)+'</span></label>'}).join("")+
 '<label class="opt"><input type="radio" name="a" value="-1"><span><i>Не знаю</i></span></label></div>'+
 '<div class="nav"><span></span><button class="btn" id="next"'+(PREVIEW?"":" disabled")+'>Далее</button></div>');
 var nb=document.getElementById("next");
 [].forEach.call(document.querySelectorAll('input[name=a]'),function(r){r.onchange=function(){nb.disabled=false}});
 nb.onclick=function(){var ch=document.querySelector('input[name=a]:checked');var v=ch?+ch.value:0;
  var ans=v<0?"(не знаю)":it.opts[v];S.answers.push({lv:it.lv,q:it.q,ans:ans,ok:ans===it.ok,right:it.ok,topic:it.topic});
  S.qi++;if(S.qi<PER)return question();
  var sc=S.answers.slice(-PER).filter(function(a){return a.ok}).length;S.stages.push({lv:LV[S.L],score:sc});
  if(sc>=5&&S.L<4)S.L++;else if(sc<=2&&S.L>0)S.L--;
  S.stage++;if(S.stage<STAGES)nextStage();else startReading()}}
function grammarLevel(){
 var by={};S.answers.forEach(function(a){by[a.lv]=by[a.lv]||[0,0];by[a.lv][1]++;if(a.ok)by[a.lv][0]++});
 var g=0;for(var i=0;i<5;i++){var b=by[LV[i]];if(b&&b[0]/b[1]>=.6)g=i}
 var low=by.A1&&by.A1[0]/by.A1[1]<.5;return {g:g,by:by,low:!!low}}
function band(g){return g<=1?"low":g==2?"mid":"high"}

/* ---------- 3. чтение ---------- */
function startReading(){S.gl=grammarLevel();S.read=band(S.gl.g);S.rAns=[];reading()}
function qblock(qs,name){return qs.map(function(q,k){var o=shuffle(q[1]);q._o=o;return '<div class="rq"><p>'+(k+1)+'. '+esc(q[0])+'</p><div class="opts">'+o.map(function(x,i){return '<label class="opt"><input type="radio" name="'+name+k+'" value="'+i+'"><span>'+esc(x)+'</span></label>'}).join("")+'</div></div>'}).join("")}
function collect(qs,name){var out=[];for(var k=0;k<qs.length;k++){var c=document.querySelector('input[name='+name+k+']:checked');if(!c){if(!PREVIEW)return null;out.push({q:qs[k][0],ans:qs[k]._o[0],ok:qs[k]._o[0]===qs[k][1][0],right:qs[k][1][0]});continue}var a=qs[k]._o[+c.value];out.push({q:qs[k][0],ans:a,ok:a===qs[k][1][0],right:qs[k][1][0]})}return out}
function reading(){var R=READ[S.read];
 render(steps(2)+'<span class="kicker">Часть 3 из 4 · чтение</span><h2>'+R.title+'</h2><p class="muted">Прочитайте текст и ответьте на вопросы.</p><div class="text" lang="en">'+R.text+'</div>'+qblock(R.q,"r")+
 '<div class="err" id="err"></div><div class="nav"><span></span><button class="btn" id="next">Далее</button></div>');
 document.getElementById("next").onclick=function(){var a=collect(R.q,"r");if(!a){document.getElementById("err").textContent="Пожалуйста, ответьте на все вопросы.";return}S.rAns=a;startListening()}}

/* ---------- 4. аудирование ---------- */
var voices=[];function loadV(){voices=window.speechSynthesis?speechSynthesis.getVoices():[]}

function pick(male){var en=voices.filter(function(v){return /^en(-|_)/i.test(v.lang)});var gb=en.filter(function(v){return /GB/i.test(v.lang)});var pool=gb.length?gb:en;
 var M=/male|daniel|arthur|oliver|george|ryan|thomas|fred|alex|aaron|guy/i,F=/female|serena|kate|martha|libby|sonia|samantha|karen|moira|tessa|victoria|susan|emma|zira|hazel/i;
 var r=pool.filter(function(v){return male?(M.test(v.name)&&!/female/i.test(v.name)):F.test(v.name)});return r[0]||pool[male?0:pool.length-1]||null}
var MAXPLAYS=2;
function startListening(){var rs=S.rAns.filter(function(a){return a.ok}).length;
 S.listen=band(S.gl.g);S.lAns=[];S.plays=0;listening()}
function listening(){var L=LISTEN[S.listen];
 render(steps(3)+'<span class="kicker">Часть 4 из 4 · аудирование</span><h2>'+L.title+'</h2><p class="muted">Нажмите ▶ и послушайте разговор. Его можно прослушать два раза. Затем ответьте на вопросы.</p>'+
 '<div class="player"><button class="play" id="play" aria-label="Слушать">▶</button><div><b id="pst">Прослушиваний: 0 из '+MAXPLAYS+'</b><small>Говорят Tom и Rachel</small></div><audio id="au" preload="auto" src="'+AUDIO[S.listen]+'"></audio></div>'+qblock(L.q,"l")+
 '<div class="err" id="err"></div><div class="nav"><span></span><button class="btn" id="next">Узнать результат</button></div>');
 var au=document.getElementById("au"),pb=document.getElementById("play"),pst=document.getElementById("pst"),hasFile=true;
 au.addEventListener("error",function(){hasFile=false});
 au.onended=function(){pb.textContent="▶";upd()};
 function upd(){pst.textContent="Прослушиваний: "+S.plays+" из "+MAXPLAYS;if(S.plays>=MAXPLAYS)pb.disabled=true}
 pb.onclick=function(){if(S.plays>=MAXPLAYS)return;
  if(hasFile){if(!au.paused)return;S.plays++;pb.textContent="♪";au.currentTime=0;au.play();upd();return}
  if(!window.speechSynthesis){document.getElementById("err").textContent="Ваш браузер не воспроизводит звук. Попробуйте открыть страницу в Safari или Chrome.";return}
  if(speechSynthesis.speaking)return;S.plays++;pb.textContent="♪";upd();
  var tv=pick(true),rv=pick(false);
  L.lines.forEach(function(ln,i){var u=new SpeechSynthesisUtterance(ln[1]);var v=ln[0]=="T"?tv:rv;if(v){u.voice=v;u.lang=v.lang}else u.lang="en-GB";
   u.rate=L.rate;u.pitch=ln[0]=="T"?(tv===rv?.8:1):(tv===rv?1.25:1);if(i==L.lines.length-1)u.onend=function(){pb.textContent="▶";upd()};speechSynthesis.speak(u)})};
 document.getElementById("next").onclick=function(){var a=collect(L.q,"l");if(!a){document.getElementById("err").textContent="Пожалуйста, ответьте на все вопросы.";return}
  if(window.speechSynthesis)speechSynthesis.cancel();au.pause();S.lAns=a;result()}}

/* ---------- 5. результат ---------- */
function skill(b,sc){var base={low:.5,mid:2,high:3.5}[b];return Math.max(0,Math.min(4,base+(sc-2.5)*.6))}
function result(){
 var G=S.gl.g,rs=S.rAns.filter(function(a){return a.ok}).length,ls=S.lAns.filter(function(a){return a.ok}).length;
 var Rk=skill(S.read,rs),Lk=skill(S.listen,ls);var fin=Math.round((2*G+Rk+Lk)/4);fin=Math.max(0,Math.min(4,fin));
 var lv=LV[fin],gOk=S.answers.filter(function(a){return a.ok}).length;
 var wrong={},right={};S.answers.forEach(function(a){if(a.ok){if(LV.indexOf(a.lv)<=fin+1)right[a.topic]=1}else wrong[a.topic]=1});
 var weakT=S.answers.filter(function(a){return !a.ok}).sort(function(x,y){return LV.indexOf(x.lv)-LV.indexOf(y.lv)}).map(function(a){return a.topic}).filter(function(t,i,arr){return arr.indexOf(t)===i}),strongT=Object.keys(right).filter(function(t){return !wrong[t]});
 var plus=[],minus=[];
 if(strongT.length)plus.push("Уверенно: "+strongT.slice(0,6).join(", "));
 if(rs>=3)plus.push("Хорошо понимаете письменный текст своего уровня");else minus.push("Понимание текста: стоит больше читать адаптированные тексты своего уровня");
 if(ls>=3)plus.push("Хорошо воспринимаете речь на слух");else minus.push("Аудирование: полезно регулярно слушать английскую речь в своём темпе");
 if(weakT.length)minus.unshift("Грамматика и лексика: "+weakT.slice(0,8).join(", "));
 if(!plus.length)plus.push("Вы уже сделали первый шаг — прошли тест до конца. С этого и начнём!");
 S.res={lv:lv,G:LV[G],gOk:gOk,gN:S.answers.length,rs:rs,ls:ls,plus:plus,minus:minus};
 render(steps(4)+'<span class="kicker">Ваш ориентировочный результат</span><h2>'+esc(S.form.name)+', спасибо, что прошли тест!</h2>'+
 '<div class="lvl">'+lv+'</div><p><b>'+LVNAME[lv]+' уровень</b></p><p>'+LVDESC[lv]+'</p>'+
 '<div class="res-grid"><div><b>'+gOk+' / '+S.answers.length+'</b><span>грамматика и лексика</span></div><div><b>'+rs+' / 4</b><span>чтение</span></div><div><b>'+ls+' / 4</b><span>аудирование</span></div></div>'+
 '<h3 style="font-weight:400;font-style:italic;color:var(--orange);font-size:22px;margin:22px 0 4px">Ваши сильные стороны</h3><ul class="list">'+plus.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>'+
 (minus.length?'<h3 style="font-weight:400;font-style:italic;color:var(--orange);font-size:22px;margin:18px 0 4px">Над чем стоит поработать</h3><ul class="list">'+minus.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>':'')+
 '<div class="note">Это ориентировочный результат по грамматике, лексике, чтению и аудированию. Говорение и письмо оценит преподаватель на пробном занятии. Помните: подтвердить ваш уровень могут только наши преподаватели-лингвисты.</div>'+
 '<div class="send" id="send">Отправляем ваши ответы преподавателю…</div>'+
 '<div class="mgr" id="mgr"><p class="mt">Чтобы наш менеджер связался с вами, оставьте номер WhatsApp:</p><form id="phf" class="phf"><label for="ph" class="sr">Номер WhatsApp</label><input type="tel" id="ph" inputmode="tel" autocomplete="tel" placeholder="+1 555 123 4567"><button class="btn mg" type="submit">Отправить</button></form><div class="err" id="pherr"></div></div>'+
 '<div class="nav"><a class="btn o" href="../">На главную</a><a class="btn" href="https://wa.me/'+WA+'" target="_blank" rel="noopener">Записаться на пробное занятие</a></div>');
 bindPhone();send()}
function report(){var f=S.form,r=S.res;
 var lines=["Имя: "+f.name,"Возраст: "+f.age,"Формат обучения: "+(f.fmt||"—"),"WhatsApp: "+(f.phone||"—"),"Опыт: "+(f.exp.join("; ")||"—"),"Как давно: "+(f.when||"—"),"Слабые стороны: "+(f.weak.concat(f.weako?[f.weako]:[]).join("; ")||"—"),"Сильные стороны: "+(f.str||"—"),"Что подтянуть: "+(f.goal||"—"),"Ожидания: "+(f.expect||"—"),"",
  "ОРИЕНТИРОВОЧНЫЙ УРОВЕНЬ: "+r.lv+" ("+LVNAME[r.lv]+")","Грамматика и лексика: "+r.gOk+"/"+r.gN+" (уровень по грамматике: "+r.G+")","Чтение: "+r.rs+"/4 (текст "+S.read+")","Аудирование: "+r.ls+"/4 (запись "+S.listen+")","Блоки теста: "+S.stages.map(function(s){return s.lv+" "+s.score+"/6"}).join(", "),"",
  "Сильные: "+r.plus.join(" | "),"Поработать: "+(r.minus.join(" | ")||"—"),"","ОШИБКИ В ГРАММАТИКЕ:"];
 S.answers.filter(function(a){return !a.ok}).forEach(function(a){lines.push("["+a.lv+"] "+a.q+" — ответ: "+a.ans+"; верно: "+a.right)});
 S.rAns.concat(S.lAns).filter(function(a){return !a.ok}).forEach(function(a,i){if(!i)lines.push("","ОШИБКИ В ЧТЕНИИ/АУДИРОВАНИИ:");lines.push(a.q+" — ответ: "+a.ans+"; верно: "+a.right)});

function bindPhone(){var f=document.getElementById("phf");if(!f)return;f.onsubmit=function(e){e.preventDefault();var v=document.getElementById("ph").value.trim(),er=document.getElementById("pherr");

 if(PREVIEW){done();return}
 var r=S.res,fm=S.form;f.querySelector("button").disabled=true;

 .then(function(x){return x.json()}).then(function(j){if(j&&j.success)done();else throw 0})
 .catch(function(){f.querySelector("button").disabled=false;er.innerHTML='Не получилось отправить. Попробуйте ещё раз или <a href="https://wa.me/'+WA+'" target="_blank" rel="noopener">напишите нам в WhatsApp</a>.'})}}

 var data={access_key:ACCESS_KEY,subject:"Тест We Talk: "+f.name+", "+f.age+" — "+r.lv,from_name:"We Talk — тест уровня",botcheck:"",
  "Имя":f.name,"Возраст":f.age,"Формат":f.fmt||"—","Уровень":r.lv+" ("+LVNAME[r.lv]+")","Отчёт":txt};
 fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(data)})
 .then(function(x){return x.json()}).then(function(j){if(j&&j.success){box.className="send ok";box.textContent="✓ Ваши ответы успешно отправлены."}else throw 0})
 .catch(function(){box.className="send bad";var wa="https://wa.me/"+WA+"?text="+encodeURIComponent("Здравствуйте! Я прошла тест на сайте We Talk.\n\n"+txt.slice(0,1800));
  box.innerHTML='Не получилось отправить ответы автоматически. <button class="btn o" id="retry" style="margin:10px 8px 0 0;padding:10px 18px">Попробовать ещё раз</button><a class="btn" style="margin-top:10px;padding:10px 18px" target="_blank" rel="noopener" href="'+wa+'">Отправить в WhatsApp</a>';
  document.getElementById("retry").onclick=function(){box.className="send";box.textContent="Отправляем…";send()}})}
/* ---------- режим просмотра страниц (?preview / #preview) ---------- */
var PREVIEW=/preview/.test(location.search+location.hash);
if(PREVIEW){
 var _send=send;send=function(){var box=document.getElementById("send");box.className="send ok";box.textContent="✓ Ваши ответы успешно отправлены. (режим просмотра — письмо не отправлено)"};
 demoForm();
 function demoForm(){S.form={name:"Анна",age:"30",fmt:"В мини-группе (до 4 человек)",exp:["Учила в школе"],when:"",weak:[],weako:"",str:"",goal:"",expect:""}}
 function demoGrammar(L){demoForm();S.L=L;S.stage=0;S.seen={A1:{},A2:{},B1:{},B2:{},C1:{}};S.answers=[];S.stages=[];nextStage()}
 function demoRead(b){demoForm();S.answers=[];S.gl={g:{low:1,mid:2,high:3}[b],by:{}};S.read=b;S.rAns=[];reading()}
 function demoListen(b){demoForm();S.gl={g:{low:1,mid:2,high:3}[b],by:{}};S.listen=b;S.lAns=[];S.plays=0;listening()}
 function demoResult(lv){demoForm();var k=LV.indexOf(lv);S.answers=[];S.stages=[];
  [0,1,2,3,4].forEach(function(i){var L=LV[Math.max(0,Math.min(4,k-1+(i>2?1:0)))];BANK[L].slice(i*2,i*2+6).forEach(function(q,j){var ok=j<4;S.answers.push({lv:L,q:q[0],ans:ok?q[1][0]:q[1][1],ok:ok,right:q[1][0],topic:q[2]})})});
  S.gl={g:k,by:{},low:false};var b=band(k);S.read=b;S.listen=b;S.rAns=[1,1,1,0].map(function(o){return{ok:!!o,q:"",ans:"",right:""}});S.lAns=[1,1,0,1].map(function(o){return{ok:!!o,q:"",ans:"",right:""}});result()}
 var bar=document.createElement("div");bar.className="pvbar";
 var B=[["Начало",intro],["Анкета",function(){demoForm();survey()}],["Вопросы A1",function(){demoGrammar(0)}],["A2",function(){demoGrammar(1)}],["B1",function(){demoGrammar(2)}],["B2",function(){demoGrammar(3)}],["C1",function(){demoGrammar(4)}],
  ["Чтение: простое",function(){demoRead("low")}],["среднее",function(){demoRead("mid")}],["сложное",function(){demoRead("high")}],
  ["Аудирование: простое",function(){demoListen("low")}],["среднее",function(){demoListen("mid")}],["сложное",function(){demoListen("high")}],
  ["Результат A1",function(){demoResult("A1")}],["A2",function(){demoResult("A2")}],["B1",function(){demoResult("B1")}],["B2",function(){demoResult("B2")}],["C1",function(){demoResult("C1")}]];
 bar.innerHTML='<b>Просмотр страниц теста</b>'+B.map(function(x,i){return '<button type="button" data-i="'+i+'">'+x[0]+'</button>'}).join("");
 bar.addEventListener("click",function(e){var t=e.target.closest("button");if(t){B[+t.dataset.i][1]()}});
 document.body.appendChild(bar);
 var st=document.createElement("style");st.textContent=".pvbar{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#131d11;color:#efe9dc;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;overflow-x:auto;align-items:center;font-size:12px;box-shadow:0 -6px 20px rgba(0,0,0,.4)}.pvbar b{white-space:nowrap;margin-right:6px;font-weight:400;font-style:italic}.pvbar button{flex:none;font:inherit;font-size:12px;padding:7px 11px;border:1px solid rgba(239,233,220,.5);background:transparent;color:inherit;border-radius:999px;cursor:pointer}.pvbar button:hover{background:#da5200;border-color:#da5200}body{padding-bottom:64px}";
 document.head.appendChild(st);
}

intro();
})();
